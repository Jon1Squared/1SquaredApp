name: Platform CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, Isolation Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Verify invented-only fixture data in data/
        run: |
          if git grep -n -i "1squared\.co\.uk\|c9bd9acf\|72f9[8]8bf" -- data/; then
            echo "ERROR: Real email domain or corporate Entra tenant/object ID found in data/"
            exit 1
          fi

      - name: Run unit, contract & two-tenant isolation tests
        run: npx vitest run

      - name: Verify production build
        run: npm run build
