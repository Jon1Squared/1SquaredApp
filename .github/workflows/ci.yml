name: Platform CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'chore/**'
      - 'fix/**'
      - 's0-*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, Isolation Tests & Build
    runs-on: ubuntu-latest
    env:
      PLATFORM_TENANT_PACKAGE_DIR: client-not-a-law-firm
      PLATFORM_ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --config .gitleaks.toml --redact

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate extension registry
        run: npm run generate:extensions

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Verify invented-only fixture data in data/ and src/seed/
        run: node scripts/verify-invented-fixtures.mjs

      - name: Verify generated extension registry contains bundled extension
        run: grep -q "extModule_0" src/platform/generated/extensionRegistry.ts

      - name: Run unit, contract & two-tenant isolation tests
        run: npm test

      - name: Verify production build
        env:
          PLATFORM_TENANT_PACKAGE_DIR: client-not-a-law-firm
          PLATFORM_ENVIRONMENT: live
        run: npm run build
