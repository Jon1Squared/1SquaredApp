name: Platform CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'chore/**'
      - 'fix/**'
      - 's0-*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, Isolation Tests & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      PLATFORM_TENANT_PACKAGE_DIR: client-not-a-law-firm
      PLATFORM_ENVIRONMENT: test
      PLATFORM_POSTGRES_HOST: 127.0.0.1
      PLATFORM_POSTGRES_PORT: '6432'
      PLATFORM_POSTGRES_MIGRATE_PORT: '5432'
      PLATFORM_HOSTING_MODE: multi_tenant
      # Throwaway CI cluster credentials (R435): core has no built-in passwords.
      PLATFORM_POSTGRES_ADMIN_USER: postgres
      PLATFORM_POSTGRES_ADMIN_PASSWORD: postgres
      PLATFORM_POSTGRES_RUNTIME_PASSWORD: onesquared_local_runtime
      PLATFORM_POSTGRES_MIGRATE_PASSWORD: onesquared_local_migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret scan
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sudo tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          rm -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          gitleaks dir . --config .gitleaks.toml --redact

      - name: Validate Bicep infrastructure templates (build & lint)
        run: |
          az bicep build --file core/infra/main.bicep --stdout > /dev/null
          for f in core/infra/main.bicep core/infra/modules/*.bicep; do
            az bicep lint --file "$f"
          done

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start PgBouncer in transaction mode (port 6432) and provision test PostgreSQL databases (R401, R402)
        run: |
          node scripts/setup-test-postgres.mjs
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer postgresql-client
          cat <<'EOF' | sudo tee /etc/pgbouncer/pgbouncer.ini > /dev/null
          [databases]
          * = host=127.0.0.1 port=5432

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = scram-sha-256
          auth_file = /etc/pgbouncer/userlist.txt
          pool_mode = transaction
          max_client_conn = 200
          default_pool_size = 5
          admin_users = postgres
          EOF
          cat <<EOF | sudo tee /etc/pgbouncer/userlist.txt > /dev/null
          "${PLATFORM_POSTGRES_ADMIN_USER:-postgres}" "${PLATFORM_POSTGRES_ADMIN_PASSWORD}"
          "${PLATFORM_POSTGRES_RUNTIME_USER:-runtime_login}" "${PLATFORM_POSTGRES_RUNTIME_PASSWORD}"
          "${PLATFORM_POSTGRES_MIGRATE_USER:-migrate_login}" "${PLATFORM_POSTGRES_MIGRATE_PASSWORD}"
          EOF
          sudo chown postgres:postgres /etc/pgbouncer/pgbouncer.ini /etc/pgbouncer/userlist.txt
          sudo chmod 600 /etc/pgbouncer/userlist.txt
          sudo systemctl restart pgbouncer
          for i in $(seq 1 20); do
            pg_isready -h 127.0.0.1 -p 6432 && break
            sleep 0.5
          done
          pg_isready -h 127.0.0.1 -p 6432

      - name: Generate extension registry
        run: npm run generate:extensions

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Verify invented-only fixture data in data/ and src/seed/
        run: node scripts/verify-invented-fixtures.mjs

      - name: Verify no demo literals in src/components/ and src/domain/
        run: node scripts/verify-no-demo-literals.mjs

      - name: Verify generated extension registry contains bundled extension
        run: grep -q "extModule_0" src/platform/generated/extensionRegistry.ts

      - name: Run unit, contract & two-tenant isolation tests
        run: npm test

      - name: Verify production build
        env:
          PLATFORM_TENANT_PACKAGE_DIR: client-not-a-law-firm
          PLATFORM_ENVIRONMENT: live
        run: npm run build

      - name: Verify client bundle contains no API keys
        run: '! grep -rEq "\bak_[A-Za-z0-9]{20,}\b|sk-ant-" .next/static'

      - name: Verify bundled job entry point and container image (R404)
        run: |
          node dist/jobs/run-job.mjs --list
          node dist/jobs/import-store.mjs --help
          docker build --build-arg PLATFORM_TENANT_PACKAGE_DIR="$PLATFORM_TENANT_PACKAGE_DIR" -t onesquared-ci:test .
          docker run --rm onesquared-ci:test node dist/jobs/run-job.mjs --list
          docker run --rm onesquared-ci:test node dist/jobs/import-store.mjs --help

  e2e:
    name: Role Journey Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      PLATFORM_TENANT_PACKAGE_DIR: client-not-a-law-firm
      PLATFORM_ENVIRONMENT: test
      PLATFORM_POSTGRES_HOST: 127.0.0.1
      PLATFORM_POSTGRES_PORT: '6432'
      PLATFORM_POSTGRES_MIGRATE_PORT: '5432'
      PLATFORM_HOSTING_MODE: multi_tenant
      # Throwaway CI cluster credentials (R435): core has no built-in passwords.
      PLATFORM_POSTGRES_ADMIN_USER: postgres
      PLATFORM_POSTGRES_ADMIN_PASSWORD: postgres
      PLATFORM_POSTGRES_RUNTIME_PASSWORD: onesquared_local_runtime
      PLATFORM_POSTGRES_MIGRATE_PASSWORD: onesquared_local_migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start PgBouncer in transaction mode (port 6432) and provision test PostgreSQL databases (R401, R402)
        run: |
          node scripts/setup-test-postgres.mjs
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer postgresql-client
          cat <<'EOF' | sudo tee /etc/pgbouncer/pgbouncer.ini > /dev/null
          [databases]
          * = host=127.0.0.1 port=5432

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = scram-sha-256
          auth_file = /etc/pgbouncer/userlist.txt
          pool_mode = transaction
          max_client_conn = 200
          default_pool_size = 5
          admin_users = postgres
          EOF
          cat <<EOF | sudo tee /etc/pgbouncer/userlist.txt > /dev/null
          "${PLATFORM_POSTGRES_ADMIN_USER:-postgres}" "${PLATFORM_POSTGRES_ADMIN_PASSWORD}"
          "${PLATFORM_POSTGRES_RUNTIME_USER:-runtime_login}" "${PLATFORM_POSTGRES_RUNTIME_PASSWORD}"
          "${PLATFORM_POSTGRES_MIGRATE_USER:-migrate_login}" "${PLATFORM_POSTGRES_MIGRATE_PASSWORD}"
          EOF
          sudo chown postgres:postgres /etc/pgbouncer/pgbouncer.ini /etc/pgbouncer/userlist.txt
          sudo chmod 600 /etc/pgbouncer/userlist.txt
          sudo systemctl restart pgbouncer
          for i in $(seq 1 20); do
            pg_isready -h 127.0.0.1 -p 6432 && break
            sleep 0.5
          done
          pg_isready -h 127.0.0.1 -p 6432

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run Playwright role journey smoke tests
        env:
          E2E_SKIP_BUILD: '1'
        run: npm run e2e

      - name: Upload Playwright report and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
