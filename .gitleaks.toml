title = "1Squared Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "ideal-postcodes-api-key"
description = "Ideal Postcodes API key"
regex = '''\bak_[A-Za-z0-9]{20,}\b'''
keywords = ["ak_"]

[[allowlists]]
description = "Ignore git-ignored local files, build outputs, and dependencies"
paths = [
  '''(^|[\\/])\.git([\\/]|$)''',
  '''(^|[\\/])node_modules([\\/]|$)''',
  '''(^|[\\/])\.next([\\/]|$)''',
  '''(^|[\\/])out([\\/]|$)''',
  '''(^|[\\/])build([\\/]|$)''',
  '''(^|[\\/])coverage([\\/]|$)''',
  '''(^|[\\/])\.env$''',
  '''(^|[\\/])\.env\.local$''',
  '''(^|[\\/])\.env\.(development|production|test|staging)(\.local)?$''',
  '''(^|[\\/])data[\\/]storage([\\/]|$)''',
  '''(^|[\\/])data[\\/]runtime-store\.json$''',
  '''(^|[\\/])src[\\/]platform[\\/]generated([\\/]|$)''',
]

[[allowlists]]
description = "Allow template placeholders in .env.example only"
condition = "AND"
paths = [
  '''(^|[\\/])\.env\.example$''',
]
regexes = [
  '''<YOUR_[A-Z0-9_]+>''',
  '''<GENERATE_WITH_OPENSSL_RAND_BASE64_32>''',
  '''^\s*ANTHROPIC_API_KEY=$''',
]

[[allowlists]]
description = "Allow invented test placeholders in test files only"
condition = "AND"
paths = [
  '''(^|[\\/])src[\\/](.+[\\/])?__tests__[\\/]''',
  '''(^|[\\/])src[\\/].+\.test\.ts$''',
  '''(^|[\\/])core[\\/]tests[\\/]''',
]
regexes = [
  '''KD-[A-Z0-9-]+''',
  '''test-dummy-secret-not-real''',
  '''test-secret-do-not-use-in-production''',
  '''test-ideal-postcodes-key-placeholder''',
  '''test-anthropic-key-placeholder''',
]
